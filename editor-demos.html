
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor DEMOS | EXCAVADORA-ARMO</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: #f3f4f6;
}
header {
  padding: 24px;
  text-align: center;
  background: #172338;
  border-bottom: 2px solid orange;
}
h1, h2, h3 { color: #f59e0b; }
h1 { margin: 0; }
main { max-width: 950px; margin: auto; padding: 20px; }
.panel {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 20px;
}
label { display: block; margin: 12px 0 6px; }
input, select {
  background: #0f172a;
  border: 1px solid #64748b;
  color: white;
  padding: 11px;
  border-radius: 7px;
  max-width: 100%;
}
input[type=email], input[type=password] { width: 100%; }
button {
  background: #f59e0b;
  color: #111827;
  padding: 11px 15px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-weight: bold;
}
button:disabled { opacity: .5; cursor: not-allowed; }
.secundario { background: #475569; color: white; }
.peligro { background: #ef4444; color: white; }
.acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.paso {
  border: 1px solid #475569;
  background: #111c2e;
  border-radius: 9px;
  padding: 15px;
  margin: 12px 0;
}
.campos {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 12px;
}
.oculto { display: none; }
#mensaje { min-height: 24px; color: #fbbf24; }
@media (max-width: 650px) {
  .campos { grid-template-columns: 1fr; }
}
</style>
</head>

<body>
<header>
  <h1>EXCAVADORA-ARMO</h1>
  <p>Administración | Editor de DEMOS</p>
</header>

<main>
<section class="panel" id="login">
  <h2>Acceso del administrador</h2>
  <form id="formLogin">
    <label for="correo">Correo</label>
    <input id="correo" type="email" required autocomplete="username">

    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password">

    <div class="acciones">
      <button type="submit">Iniciar sesión</button>
    </div>
  </form>
</section>

<section class="panel oculto" id="editor">
  <h2>Editor visual</h2>
  <p>Modifica secuencias sin ejecutar movimientos físicos.</p>

  <label for="idDemo">ID de DEMO existente</label>
  <input id="idDemo" type="number" min="1" value="1">

  <div class="acciones">
    <button id="cargar" type="button">Cargar DEMO</button>
    <button id="regresarAdmin" type="button" class="secundario">← Volver a Administración</button>
    <button id="salir" type="button" class="secundario">Cerrar sesión</button>
  </div>

  <h3 id="tituloDemo">Selecciona una DEMO</h3>
  <div id="pasos"></div>

  <p id="total">Duración total: 0 ms</p>

  <div class="acciones">
    <button id="agregar" type="button" disabled>+ Agregar movimiento</button>
    <button id="guardar" type="button" disabled>Guardar secuencia</button>
  </div>
</section>

<section class="panel">
  <p id="mensaje" role="status">Editor local preparado.</p>
</section>
</main>

<script>
"use strict";

const API = "https://vehiculo-iot.duckdns.org/v43";

let token = null;
let demoActual = null;
let comandos = [];
let movimientos = [];

const $ = id => document.getElementById(id);

function mensaje(texto) {
  $("mensaje").textContent = texto;
}

function headers() {
  return { Authorization: "Bearer " + token };
}

async function api(ruta, opciones = {}) {
  const respuesta = await fetch(API + ruta, {
    ...opciones,
    headers: {
      ...headers(),
      ...(opciones.headers || {})
    }
  });

  if (!respuesta.ok) {
    if (respuesta.status === 401) {
      cerrarSesion();
    }

    throw new Error("Error HTTP " + respuesta.status);
  }

  return respuesta.json();
}

function cerrarSesion() {
  try { sessionStorage.removeItem("armo:editor-admin-v6-handoff"); } catch (_) {}
  token = null;
  demoActual = null;
  comandos = [];
  movimientos = [];

  $("editor").classList.add("oculto");
  $("login").classList.remove("oculto");
  $("password").value = "";
  $("pasos").replaceChildren();
  $("agregar").disabled = true;
  $("guardar").disabled = true;
}

$("salir").onclick = cerrarSesion;

$("formLogin").onsubmit = async evento => {
  evento.preventDefault();

  try {
    const respuesta = await fetch(API + "/admin/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        correo: $("correo").value.trim(),
        password: $("password").value
      })
    });

    if (!respuesta.ok) {
      throw new Error("Credenciales administrativas inválidas.");
    }

    const datos = await respuesta.json();
    if (!datos?.access_token || typeof datos.access_token !== "string") {
      throw new Error("La API no devolvió un token administrativo válido.");
    }
    // ARMO-EDITOR-ADMIN-V6: validar rol contra la API protegida antes de abrir.
    await validarAdministrador(datos.access_token);
    abrirEditorAutorizado(datos.access_token, "Sesión administrativa iniciada.");

  } catch (error) {
    mensaje(error.message);
  }
};

// ARMO-EDITOR-ADMIN-V6
const CLAVE_ENTRADA = "armo:editor-admin-v6-handoff";
const CLAVE_REGRESO = "armo:acceso-43-handoff";

async function validarAdministrador(jwt) {
  const respuesta = await fetch(API + "/admin/clientes", {
    method: "GET",
    headers: {Authorization: "Bearer " + jwt},
    cache: "no-store"
  });
  if (!respuesta.ok) {
    throw new Error(respuesta.status === 401 || respuesta.status === 403
      ? "Acceso reservado al administrador (HTTP " + respuesta.status + ")."
      : "No se pudo verificar la sesión administrativa (HTTP " + respuesta.status + ").");
  }
}

function abrirEditorAutorizado(jwt, nota) {
  token = jwt;
  $("password").value = "";
  $("login").classList.add("oculto");
  $("editor").classList.remove("oculto");
  mensaje(nota);
}

$("regresarAdmin").addEventListener("click", async () => {
  if (!token) return;
  try {
    await validarAdministrador(token);
    // Un solo uso, no guardar el token permanentemente.
    sessionStorage.setItem(CLAVE_REGRESO, JSON.stringify({
      rol: "administrador", jwt: token, vence: Date.now() + 120000
    }));
    window.location.assign("administracion.html");
  } catch (error) {
    mensaje("No se pudo volver con esta sesión: " + error.message);
  }
});

(async function recuperarSesionAdministrativa() {
  let acceso = null;
  try {
    const dato = sessionStorage.getItem(CLAVE_ENTRADA);
    sessionStorage.removeItem(CLAVE_ENTRADA);
    if (dato) acceso = JSON.parse(dato);
  } catch (_) { /* Sin sesión válida; formulario administrativo normal. */ }
  if (!acceso || acceso.rol !== "administrador" ||
      typeof acceso.jwt !== "string" || !acceso.jwt ||
      !Number.isFinite(acceso.vence) || Date.now() > acceso.vence) return;
  try {
    await validarAdministrador(acceso.jwt);
    abrirEditorAutorizado(acceso.jwt, "Administrador verificado. Puedes editar las DEMOS.");
  } catch (error) {
    cerrarSesion();
    mensaje("Sesión no autorizada: " + error.message);
  }
})();

function actualizarTotal() {
  const total = movimientos.reduce(
    (suma, p) => suma + Number(p.duracion_ms) + Number(p.pausa_ms),
    0
  );

  $("total").textContent = "Duración total: " + total + " ms";
}

function renderizar() {
  const zona = $("pasos");
  zona.replaceChildren();

  movimientos.forEach((paso, indice) => {
    const tarjeta = document.createElement("article");
    tarjeta.className = "paso";

    const titulo = document.createElement("h3");
    titulo.textContent = "Movimiento " + (indice + 1);
    tarjeta.appendChild(titulo);

    const campos = document.createElement("div");
    campos.className = "campos";

    const campoComando = document.createElement("div");
    const etiquetaComando = document.createElement("label");
    etiquetaComando.textContent = "Comando";
    const selector = document.createElement("select");

    comandos.forEach(comando => {
      const opcion = document.createElement("option");
      opcion.value = comando.id_comando;
      opcion.textContent = comando.nombre;
      selector.appendChild(opcion);
    });

    selector.value = String(paso.id_comando);
    selector.onchange = () => {
      paso.id_comando = Number(selector.value);
    };
    campoComando.append(etiquetaComando, selector);

    function numero(etiqueta, valor, cambio, minimo, maximo) {
      const contenedor = document.createElement("div");
      const label = document.createElement("label");
      label.textContent = etiqueta;

      const input = document.createElement("input");
      input.type = "number";
      input.min = minimo;
      input.max = maximo;
      input.value = valor;
      input.style.width = "100%";

      input.oninput = () => {
        cambio(Number(input.value));
        actualizarTotal();
      };

      contenedor.append(label, input);
      return contenedor;
    }

    campos.append(
      campoComando,
      numero("Duración (ms)", paso.duracion_ms,
        valor => paso.duracion_ms = valor, 100, 500),
      numero("Pausa (ms)", paso.pausa_ms,
        valor => paso.pausa_ms = valor, 0, 1000)
    );

    tarjeta.appendChild(campos);

    const acciones = document.createElement("div");
    acciones.className = "acciones";

    const subir = document.createElement("button");
    subir.textContent = "Subir";
    subir.disabled = indice === 0;
    subir.onclick = () => {
      [movimientos[indice - 1], movimientos[indice]] =
        [movimientos[indice], movimientos[indice - 1]];
      renderizar();
    };

    const bajar = document.createElement("button");
    bajar.textContent = "Bajar";
    bajar.disabled = indice === movimientos.length - 1;
    bajar.onclick = () => {
      [movimientos[indice + 1], movimientos[indice]] =
        [movimientos[indice], movimientos[indice + 1]];
      renderizar();
    };

    const eliminar = document.createElement("button");
    eliminar.textContent = "Eliminar";
    eliminar.className = "peligro";
    eliminar.onclick = () => {
      movimientos.splice(indice, 1);
      renderizar();
    };

    acciones.append(subir, bajar, eliminar);
    tarjeta.appendChild(acciones);
    zona.appendChild(tarjeta);
  });

  actualizarTotal();
}

$("cargar").onclick = async () => {
  const id = Number($("idDemo").value);

  demoActual = null;
  movimientos = [];
  comandos = [];
  $("agregar").disabled = true;
  $("guardar").disabled = true;
  $("pasos").replaceChildren();

  if (!Number.isInteger(id) || id <= 0) {
    mensaje("Introduce un ID de DEMO válido.");
    return;
  }

  try {
    mensaje("Cargando DEMO...");

    const datos = await api(`/admin/demos/${id}/editor-datos`);

    demoActual = datos.demo;
    comandos = datos.comandos;
    movimientos = datos.movimientos.map(p => ({
      id_comando: Number(p.id_comando),
      duracion_ms: Number(p.duracion_ms),
      pausa_ms: Number(p.pausa_ms)
    }));

    $("tituloDemo").textContent = demoActual.nombre;
    $("agregar").disabled = comandos.length === 0;
    $("guardar").disabled = comandos.length === 0;

    renderizar();
    mensaje("DEMO cargada. Movimientos: " + movimientos.length);

  } catch (error) {
    mensaje("No se pudo cargar la DEMO: " + error.message);
  }
};

$("agregar").onclick = () => {
  if (comandos.length === 0 || movimientos.length >= 20) return;

  movimientos.push({
    id_comando: Number(comandos[0].id_comando),
    duracion_ms: 200,
    pausa_ms: 100
  });

  renderizar();
};

$("guardar").onclick = async () => {
  if (!demoActual || movimientos.length === 0) {
    mensaje("Agrega al menos un movimiento.");
    return;
  }

  if (movimientos.length > 20) {
    mensaje("Máximo 20 movimientos.");
    return;
  }

  for (const p of movimientos) {
    const comando = comandos.find(c => c.id_comando === p.id_comando);

    if (!comando ||
        !Number.isInteger(p.duracion_ms) ||
        p.duracion_ms < 100 ||
        p.duracion_ms > Number(comando.duracion_maxima_ms) ||
        !Number.isInteger(p.pausa_ms) ||
        p.pausa_ms < 0 || p.pausa_ms > 1000) {
      mensaje("Revisa los comandos, duraciones y pausas.");
      return;
    }
  }

  if (!confirm(
    "Se reemplazará la secuencia de esta DEMO. ¿Continuar?"
  )) return;

  $("guardar").disabled = true;

  try {
    const resultado = await api(
      `/admin/demos/${demoActual.id_demo}/guardar-movimientos`,
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ movimientos })
      }
    );

    mensaje(
      "Guardado: " + resultado.movimientos_guardados +
      " movimientos. No ejecutados físicamente."
    );

  } catch (error) {
    mensaje("Error al guardar: " + error.message);
  } finally {
    $("guardar").disabled = !token || !demoActual;
  }
};
</script>
</body>
</html>
